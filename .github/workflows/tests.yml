name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install '.[dev,mcp]'
      - name: Verify isolated synthetic MCP protocol with native tracebacks
        run: >-
          python -I -c "import os; allowed={'PATH','SYSTEMROOT','WINDIR','TEMP','TMP','TMPDIR','LANG','LC_ALL','LC_CTYPE'}; clean={k:v for k,v in os.environ.items() if k in allowed}; os.environ.clear(); os.environ.update(clean); from tradeoff.feedback._setup_probe import self_test; print(self_test())"
      - name: Verify Windows cleanup and isolated agent setup
        run: >-
          python -m pytest tests/test_feedback_windows_cleanup.py
          tests/test_feedback_store_lifecycle.py
          tests/test_feedback_onboarding.py::test_setup_generates_private_configuration_and_never_seeds_real_evidence
          tests/test_feedback_onboarding.py::test_generated_config_reaches_the_selected_workspace
          tests/test_feedback_setup_cli.py
  feedback-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install '.[dev,mcp]'
      - run: python -m pytest tests/test_feedback_*.py
      - run: tradeoff feedback demo --output feedback-output-demo --json
      - run: python -m build
      - name: Verify installed setup outside the checkout
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='tradeoff-first-use-') as temporary:
              project = pathlib.Path(temporary).resolve() / 'agent workspace'
              project.mkdir()
              connect = subprocess.run([sys.executable, '-I', '-m', 'tradeoff', 'connect', '--project', str(project), '--json'], cwd=project, capture_output=True, text=True)
              assert connect.returncode == 0, connect.stdout
              setup = json.loads(connect.stdout)
              assert setup['self_test']['tools'] == 10 and setup['agent_hook'] == 'NOT_VERIFIED'
              doctor = subprocess.run([sys.executable, '-I', '-m', 'tradeoff', 'doctor', '--project', str(project), '--json'], cwd=project, capture_output=True, text=True)
              assert doctor.returncode == 1, doctor.stdout
              result = json.loads(doctor.stdout)
              assert result['setup_status'] == 'READY' and result['evidence_status'] == 'NO_DECISIONS'
              assert result['counts']['events'] == 0
          PY
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m build
      - run: tradeoff demo --output demo-output
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -e '.[dev,adapters,cases]'
      - run: python -m pytest
      - run: tradeoff cases --output public-output
      - shell: bash
        run: |
          set +e
          tradeoff lab-cases --output failure-public-output
          casebook_status=$?
          test "$casebook_status" -eq 1
  first-use:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install as a new user
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install '.[audit]'
      - name: Reproduce a public future-data bug and verify the same-fixture repair
        shell: bash
        run: |
          tradeoff demo-bug --output bug-output --json
          set +e
          tradeoff reproduce bug-output/reproducer.json
          original_status=$?
          set -e
          test "$original_status" -eq 1
          tradeoff reproduce bug-output/reproducer.json --adapter tradeoff.cases.riskkit:fixed_run
      - name: Run the agent example and reproduce its expected policy failure
        shell: bash
        run: |
          set +e
          python -m examples.agent_integration --output failure-output-agent --json
          example_status=$?
          tradeoff replay-failure failure-output-agent/failure-fixture.json
          replay_status=$?
          test "$example_status" -eq 1 && test "$replay_status" -eq 1
