<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>@@TITLE@@</title>
  <style>@@CSS@@</style>
</head>
<body class="@@BODY_CLASS@@">
  <a class="skip-link" href="#main">Skip to report</a>
  <div class="page-shell">
    <header class="masthead">
      <a class="wordmark" href="#overview" aria-label="Tradeoff, report overview">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 4h24v6h-9v20h-6V10H4V4z" fill="currentColor"/></svg>
        <span>Tradeoff<span class="brand-period">.</span></span>
      </a>
      <p class="brand-description">Strategy diagnostics<br>Local research</p>
      <div class="masthead-meta"><span class="local-mark">LOCAL · OFFLINE</span><span>@@HEADER_META@@</span></div>
    </header>
    @@NAV@@
    <main id="main" tabindex="-1">@@CONTENT@@</main>
    <footer class="site-footer"><span>Tradeoff <span class="mono">@@VERSION@@</span> · alpha</span><span>Local strategy diagnostics</span><span class="mono">@@FOOTER_META@@</span></footer>
  </div>
  <script id="report-data" type="application/json">@@DATA@@</script>
  <script>@@JS@@</script>
</body>
</html>
