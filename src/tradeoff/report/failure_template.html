<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>@@TITLE@@</title>
<style>@@CSS@@</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to report</a>
<div class="page-shell @@SHELL_CLASS@@">
<header class="masthead">
  <a class="brand wordmark" href="#main" aria-label="Tradeoff, execution report">
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="17" width="5" height="9" rx="1" fill="currentColor"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg>
    <span>Tradeoff</span>
  </a>
  <span class="brand-description">EXECUTION LAB</span>
</header>
<div class="terminal-topbar"><strong>Native execution</strong><span>SIMULATED / POLICY CHECKS</span><span class="offline-indicator">Offline report</span></div>
@@NAV@@
<main id="main" tabindex="-1">@@CONTENT@@</main>
<footer class="site-footer"><span>Tradeoff · @@VERSION@@</span><span>SELF-CONTAINED / OFFLINE</span></footer>
</div>
<script id="failure-data" type="application/json">@@DATA@@</script>
<script>@@JS@@</script>
</body>
</html>
